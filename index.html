<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b101b"><title>Daily — seu dia em foco</title><link rel="manifest" href="/manifest.webmanifest"><style>
:root{--bg:#0b101b;--panel:#19243a;--accent:#518bff;--text:#f4f7ff;--muted:#a9b8d3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}main{max-width:560px;margin:auto;padding:24px 18px 100px}header,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:32px;letter-spacing:-2px;margin:0}h1 span{color:var(--accent)}h2{font-size:19px;margin:0 0 16px}.muted,small{color:var(--muted)}.card{background:var(--panel);border-radius:20px;padding:20px;margin:16px 0}.progress{height:9px;background:#ffffff20;border-radius:9px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:var(--accent);transition:width .2s}.big{font-size:42px;font-weight:800}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--panel);display:flex;justify-content:center;padding:12px 6px max(12px,env(safe-area-inset-bottom));gap:5px;border-top:1px solid #ffffff15}.tabs button{border:0;background:none;color:var(--muted);padding:10px 14px;border-radius:12px}.tabs button.active{background:var(--accent);color:#07101c;font-weight:700}.primary{border:0;background:var(--accent);color:#08121d;border-radius:12px;padding:12px 16px;font-weight:750}.secondary{border:1px solid #ffffff35;background:transparent;color:var(--text);border-radius:10px;padding:8px 10px}.task{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ffffff15}.task:last-child{border:0}.task input{accent-color:var(--accent);width:19px;height:19px}.task label{flex:1}.done{text-decoration:line-through;opacity:.55}.task button{background:none;border:0;color:var(--muted);font-size:20px}.field{background:var(--bg);border:1px solid #ffffff30;border-radius:10px;color:var(--text);padding:12px;width:100%;margin:5px 0 10px}.swatches{display:flex;flex-wrap:wrap;gap:12px}.swatch{width:38px;height:38px;border:3px solid #ffffff66;border-radius:50%}.empty{color:var(--muted);padding:20px 0}section[hidden]{display:none}.block{border-left:4px solid var(--accent);padding-left:14px;margin:15px 0}.block small{display:block;margin-top:5px}</style></head><body><main><header><h1>daily<span>.</span></h1><small id="date"></small></header><section id="today"><div class="card"><div class="muted">Seu progresso hoje</div><div class="big" id="pct">0%</div><div class="progress"><div id="bar"></div></div><small id="counter"></small></div><div class="between"><h2>Tarefas do dia</h2><button class="primary" onclick="addTask()">+ Nova tarefa</button></div><div class="card" id="tasks"></div><h2>Seus blocos</h2><div class="card" id="blocksToday"></div></section><section id="planning" hidden><h2>Planejamento</h2><div class="card"><label>Nome do bloco<input class="field" id="blockName" placeholder="Ex.: Academia"></label><label>Horário<input class="field" id="blockTime" type="time" value="09:00"></label><button class="primary" onclick="addBlock()">Adicionar bloco</button></div><div class="card" id="blocks"></div></section><section id="habits" hidden><h2>Hábitos</h2><div class="card"><input class="field" id="habitName" placeholder="Ex.: Beber água"><button class="primary" onclick="addHabit()">Adicionar hábito</button></div><div class="card" id="habitsList"></div></section><section id="stats" hidden><h2>Estatísticas</h2><div class="card"><div class="muted">Tarefas concluídas hoje</div><div class="big" id="statDone">0</div></div><div class="card"><div class="muted">Hábitos marcados hoje</div><div class="big" id="statHabits">0</div></div></section><section id="settings" hidden><h2>Personalizar</h2><div class="card"><p>Escolha sua cor</p><div class="swatches" id="swatches"></div></div><div class="card"><p class="muted">Os dados desta versão são salvos somente neste navegador.</p><button class="secondary" onclick="exportData()">Exportar backup</button></div></section></main><nav class="tabs" id="nav"></nav><script>
const palettes=[['Azul elétrico','#518bff','#0b101b','#19243a'],['Verde-limão','#c7f53b','#0c100d','#171e18'],['Vermelho','#ef5258','#110e12','#241a20'],['Roxo','#b18cff','#100d1b','#231b37'],['Rosa','#ff80bb','#160d17','#2b1a2b'],['Laranja','#ffad5c','#17110d','#30231b']];
const key='daily-app-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};data.tasks||=[];data.blocks||=[];data.habits||=[];data.palette??=0;let page='today';const today=()=>new Date().toLocaleDateString('sv-SE');const save=()=>{localStorage.setItem(key,JSON.stringify(data));render()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function addTask(){let t=prompt('Qual tarefa você quer adicionar?');if(t?.trim()){data.tasks.push({id:Date.now(),name:t.trim(),done:false,date:today()});save()}}function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save()}}function removeTask(id){data.tasks=data.tasks.filter(x=>x.id!==id);save()}function addBlock(){let name=document.getElementById('blockName').value.trim(),time=document.getElementById('blockTime').value;if(!name)return alert('Informe o nome do bloco');data.blocks.push({id:Date.now(),name,time});document.getElementById('blockName').value='';save()}function removeBlock(id){data.blocks=data.blocks.filter(x=>x.id!==id);save()}function addHabit(){let name=document.getElementById('habitName').value.trim();if(!name)return;data.habits.push({id:Date.now(),name,days:[]});document.getElementById('habitName').value='';save()}function toggleHabit(id){let h=data.habits.find(x=>x.id===id);if(!h)return;h.days=h.days.includes(today())?h.days.filter(d=>d!==today()):[...h.days,today()];save()}function removeHabit(id){data.habits=data.habits.filter(x=>x.id!==id);save()}function choosePalette(i){data.palette=i;save()}function show(p){page=p;render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='daily-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function render(){let pal=palettes[data.palette]||palettes[0];document.documentElement.style.setProperty('--accent',pal[1]);document.documentElement.style.setProperty('--bg',pal[2]);document.documentElement.style.setProperty('--panel',pal[3]);document.querySelector('meta[name="theme-color"]').content=pal[2];document.getElementById('date').textContent=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'short'});let tasks=data.tasks.filter(x=>x.date===today()),done=tasks.filter(x=>x.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;document.getElementById('pct').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';document.getElementById('counter').textContent=done+' de '+tasks.length+' tarefas concluídas';document.getElementById('tasks').innerHTML=tasks.length?tasks.map(t=>'<div class="task"><input aria-label="Concluir tarefa" type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask('+t.id+')"><label class="'+(t.done?'done':'')+'">'+esc(t.name)+'</label><button aria-label="Excluir tarefa" onclick="removeTask('+t.id+')">×</button></div>').join(''):'<div class="empty">Seu dia começa aqui. Adicione uma tarefa!</div>';let blocks=[...data.blocks].sort((a,b)=>a.time.localeCompare(b.time));let blockHTML=blocks.length?blocks.map(b=>'<div class="block"><div class="between"><strong>'+esc(b.name)+'</strong><button class="secondary" onclick="removeBlock('+b.id+')">Excluir</button></div><small>'+esc(b.time)+'</small></div>').join(''):'<div class="empty">Nenhum bloco cadastrado.</div>';document.getElementById('blocksToday').innerHTML=blockHTML;document.getElementById('blocks').innerHTML=blockHTML;document.getElementById('habitsList').innerHTML=data.habits.length?data.habits.map(h=>'<div class="task"><input type="checkbox" '+(h.days.includes(today())?'checked':'')+' onchange="toggleHabit('+h.id+')"><label>'+esc(h.name)+'</label><button onclick="removeHabit('+h.id+')">×</button></div>').join(''):'<div class="empty">Cadastre seu primeiro hábito.</div>';document.getElementById('statDone').textContent=done;document.getElementById('statHabits').textContent=data.habits.filter(h=>h.days.includes(today())).length;document.getElementById('swatches').innerHTML=palettes.map((p,i)=>'<button class="swatch" title="'+p[0]+'" aria-label="'+p[0]+'" style="background:'+p[1]+';outline:'+(data.palette===i?'2px solid white':'none')+'" onclick="choosePalette('+i+')"></button>').join('');let tabs=[['today','Hoje'],['planning','Planejar'],['habits','Hábitos'],['stats','Dados'],['settings','Cores']];document.getElementById('nav').innerHTML=tabs.map(([id,label])=>'<button class="'+(page===id?'active':'')+'" onclick="show(\''+id+'\')">'+label+'</button>').join('');tabs.forEach(([id])=>document.getElementById(id).hidden=id!==page)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
